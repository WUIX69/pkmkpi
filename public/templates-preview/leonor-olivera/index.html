  <body>
    <script>
      // Applied before first paint so returning/system-dark-mode users
      // never see a flash of the light theme. Mirrors the logic in
      // useAccessibilityPrefs.js exactly.
      (function () {
        try {
          var stored = window.localStorage.getItem("pkmkpi-theme")
          var isDark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.setAttribute(
            "data-theme",
            isDark ? "pkmkpi-dark" : "pkmkpi",
          )
          document.documentElement.style.colorScheme = isDark ? "dark" : "light"
        } catch (e) {
          // localStorage/matchMedia may be unavailable — default theme applies.
        }
      })()
    </script>
    <div id="root"></div>
  </body>
</html>
